name: CI/CD DB_EV2 Deploy

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ignsf/db_ev2:latest .
          docker build -t ignsf/db_ev2:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ignsf/db_ev2:latest
          docker push ignsf/db_ev2:${{ github.sha }}
